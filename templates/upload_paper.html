<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload Question Paper</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f6f8;
}

/* Header */
.header{
    background:#8B4513;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* Form Container */
.container{
    max-width:500px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.container h2{
    text-align:center;
    color:#8B4513;
    margin-bottom:25px;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#8B4513;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#5c2f0c;
}
</style>
</head>

<body>

<div class="header">
    <h2>Upload Question Paper</h2>
    <a href="/faculty_dashboard">← Back to Dashboard</a>
</div>

<div class="container">
    <h2>Upload Paper</h2>

    {% with messages = get_flashed_messages() %}
  {% if messages %}
    <div style="color:green; font-weight:bold; margin-bottom:15px;">
      {{ messages[0] }}
    </div>
  {% endif %}
{% endwith %}

    <form method="POST" enctype="multipart/form-data">

        Department:
        <select name="dept">
            <option>IT</option>
            <option>CSE</option>
             <option>ECE</option>
        </select>

        Semester:
        <select name="semester">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
        </select>

       
        Subject:
        <input type="text" name="subject" required>

        Exam Type:
        <select name="exam_type">
            <option value="Internal">Internal</option>
            <option value="Semester">Semester</option>
        </select>

        Select PDF:
        <input type="file" name="file" accept=".pdf" required>

        <button type="submit">Upload Paper</button>

    </form>
    {% if message %}
    <p style="color:green; font-weight:bold;">
        {{ message }}
    </p>
{% endif %}
</div>

</body>
</html>
