<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Faculty Login</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f8;
}

.topbar{
    background:#8B4513;
    color:white;
    padding:15px;
    text-align:center;
}

.login-container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:85vh;
}

.login-card{
    background:white;
    width:350px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

.login-card h3{
    text-align:center;
    color:#8B4513;
    margin-bottom:25px;
}

.login-card input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
}

.login-card button{
    width:100%;
    padding:12px;
    background:#8B4513;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.login-card button:hover{
    background:#5c2f0c;
}

.error{
    color:red;
    text-align:center;
}

.back-link{
    text-align:center;
    margin-top:15px;
}

.back-link a{
    text-decoration:none;
    color:#8B4513;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="topbar">
    <h2>Faculty Login</h2>
</div>

<div class="login-container">
    <div class="login-card">

        <h3>Welcome Faculty 👨‍🏫</h3>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/faculty_login">
            <input type="text" name="username" placeholder="Enter Username" required>
            <input type="password" name="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="back-link">
            <a href="/">← Back to Home</a>
        </div>

    </div>
</div>

</body>
</html>
