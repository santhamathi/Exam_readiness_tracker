<!DOCTYPE html>
<html>
<head>
    <title>Faculty - Enter Marks</title>
</head>
<body>
    <h2>Faculty: Enter Marks</h2>
    <form method="post">
        Student: 
        <select name="student_id" required>
            {% for student in students %}
                <option value="{{ student[0] }}">{{ student[1] }} ({{ student[0] }})</option>
            {% endfor %}
        </select><br><br>

        Subject:
        <select name="subject_id" required>
            {% for subject in subjects %}
                <option value="{{ subject[0] }}">{{ subject[1] }}</option>
            {% endfor %}
        </select><br><br>

        Internal Marks: <input type="number" name="internal" required><br><br>
        Attendance %: <input type="number" name="attendance" required><br><br>
        Mock Test Marks: <input type="number" name="mock" required><br><br>
        Syllabus Completion %: <input type="number" name="syllabus" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
