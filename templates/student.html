<!DOCTYPE html>
<html>
<head>
    <title>Student Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
        }
        .container {
            width: 400px;
            margin: 100px auto;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #999;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 6px;
            margin: 6px 0 15px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter Academic Details</h2>

    <form method="POST">
        <label>Continuous Assessment Score</label>
        <input type="text" name="cas" required>

        <label>Attendance Percentage</label>
        <input type="text" name="attendance" required>

        <label>Mock Test Score</label>
        <input type="text" name="mock" required>

        <label>Syllabus Completion Percentage</label>
        <input type="text" name="syllabus" required>

        <button type="submit">Calculate Readiness</button>
    </form>
</div>

</body>
</html>
